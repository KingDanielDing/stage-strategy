# ============================================================================
#  WATCHLIST — this is the file you edit.
#
#  Add a line, remove a line, commit, push. The next scheduled run picks it up.
#  No redeploy, no code change.
#
#      git pull --rebase                 # the job commits cache/ and reports/ back
#      # ...edit this file...
#      git add scanner/watchlist.yml && git commit -m "watchlist: add XYZ" && git push
#
#  You can also edit it straight from github.com on your phone.
#
#  FORMAT is  TICKER: display name
#  The group decides WHEN the ticker is scanned:
#      us      -> after the US close      (22:30 UTC)
#      cn, hk  -> after the China close   (08:00 UTC)
#
#  Ticker case does not matter — 300124.sz and 300124.SZ both work, the loader
#  uppercases before calling Yahoo. Display names are left exactly as you type them.
# ============================================================================

